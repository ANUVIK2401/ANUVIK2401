<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" fill="none">
  <defs>
    <linearGradient id="nbd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d46"/><stop offset="0.55" stop-color="#ff7043"/><stop offset="1" stop-color="#00e676"/></linearGradient>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141821"/><stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family: 'SF Mono','Fira Code','JetBrains Mono',Menlo,Consolas,monospace; font-size: 14px; }
    .big { font-size: 21px; font-weight: bold; }
    .sm { font-size: 12px; }
    .green { fill: #00e676; } .cyan { fill: #7dffb8; } .purple { fill: #ff2d46; }
    .pink { fill: #ff6b6b; } .yellow { fill: #ffd54f; } .orange { fill: #ffab40; }
    .fg { fill: #e8ecf2; } .dim { fill: #727f92; }
    .line { opacity: 0; animation: pop .35s ease-out forwards; }
    @keyframes pop { from { opacity: 0; transform: translateX(-6px); } to { opacity: 1; transform: translateX(0); } }
    .l1{animation-delay:.2s} .l2{animation-delay:.7s} .l3{animation-delay:1.3s}
    .l4{animation-delay:1.7s} .l5{animation-delay:2.1s} .l6{animation-delay:2.5s}
    .l7{animation-delay:3.1s} .l8{animation-delay:3.5s} .l9{animation-delay:3.9s}
    .l10{animation-delay:4.5s} .l11{animation-delay:4.9s}
    .cursor { animation: blink 1s step-end infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .bar { animation: grow 1.2s ease-out forwards; transform-origin: left; transform: scaleX(0); }
    @keyframes grow { to { transform: scaleX(1); } }
    .b1{animation-delay:2.2s} .b2{animation-delay:2.6s} .b3{animation-delay:3.0s}
    .scan { animation: scan 4s linear infinite; }
    @keyframes scan { 0%{opacity:.05} 50%{opacity:.12} 100%{opacity:.05} }
  </style>

  <!-- window -->
  <rect x="1" y="1" width="818" height="428" rx="12" fill="url(#pbg)" stroke="url(#nbd)" stroke-width="2"/>
  <rect x="1" y="1" width="818" height="428" rx="12" fill="#ff2d46" class="scan" opacity=".05"/>
  <path d="M1 13 A12 12 0 0 1 13 1 H807 A12 12 0 0 1 819 13 V36 H1 Z" fill="#0d0f14"/>
  <circle cx="24" cy="19" r="6" fill="#ff5f56"/>
  <circle cx="44" cy="19" r="6" fill="#ffbd2e"/>
  <circle cx="64" cy="19" r="6" fill="#27c93f"/>
  <text x="410" y="24" text-anchor="middle" class="mono sm dim">anuvik@ai-systems — zsh</text>

  <g class="mono">
    <!-- boot -->
    <text x="28" y="74" class="line l1"><tspan class="green">➜</tspan><tspan class="cyan" dx="10">~</tspan><tspan class="fg" dx="10">./anuvik --init</tspan></text>
    <text x="28" y="104" class="line l2 big" filter="url(#glow)"><tspan class="purple" style="fill:url(#nbd)" letter-spacing="1">ANUVIK THOTA</tspan><tspan class="dim" dx="12">·</tspan><tspan class="cyan" dx="12">AI / ML Systems Engineer</tspan></text>
    <text x="28" y="128" class="line l3"><tspan class="dim">└─</tspan><tspan class="fg" dx="8">MSCS @ USC</tspan><tspan class="dim" dx="8">·</tspan><tspan class="fg" dx="8">ex-Oracle SWE II</tspan><tspan class="dim" dx="8">·</tspan><tspan class="fg" dx="8">AI FDE @ MSRcosmos</tspan></text>

    <!-- skill bars -->
    <text x="28" y="168" class="line l4"><tspan class="green">➜</tspan><tspan class="cyan" dx="10">~</tspan><tspan class="fg" dx="10">htop --skills</tspan></text>

    <text x="28" y="194" class="line l5"><tspan class="pink">LLM Inference</tspan></text>
    <rect x="220" y="184" width="480" height="12" rx="6" fill="#242a36" class="line l5"/>
    <rect x="220" y="184" width="450" height="12" rx="6" fill="#ff6b6b" class="bar b1" filter="url(#glow)"/>
    <text x="712" y="194" class="line l5 pink sm">94%</text>

    <text x="28" y="222" class="line l6"><tspan class="cyan">Agents / LangGraph</tspan></text>
    <rect x="220" y="212" width="480" height="12" rx="6" fill="#242a36" class="line l6"/>
    <rect x="220" y="212" width="430" height="12" rx="6" fill="#7dffb8" class="bar b2" filter="url(#glow)"/>
    <text x="712" y="222" class="line l6 cyan sm">90%</text>

    <text x="28" y="250" class="line l7"><tspan class="green">Prod Observability</tspan></text>
    <rect x="220" y="240" width="480" height="12" rx="6" fill="#242a36" class="line l7"/>
    <rect x="220" y="240" width="460" height="12" rx="6" fill="#00e676" class="bar b3" filter="url(#glow)"/>
    <text x="712" y="250" class="line l7 green sm">96%</text>

    <!-- receipts -->
    <text x="28" y="292" class="line l8"><tspan class="green">➜</tspan><tspan class="cyan" dx="10">~</tspan><tspan class="fg" dx="10">grep -r "impact" career/</tspan></text>
    <text x="28" y="318" class="line l9"><tspan class="yellow">37K+</tspan><tspan class="fg" dx="8">tenants</tspan><tspan class="dim" dx="10">|</tspan><tspan class="yellow" dx="10">72%</tspan><tspan class="fg" dx="8">MTTR cut</tspan><tspan class="dim" dx="10">|</tspan><tspan class="yellow" dx="10">92%</tspan><tspan class="fg" dx="8">ROC-AUC GNN</tspan><tspan class="dim" dx="10">|</tspan><tspan class="orange" dx="10">INT4</tspan><tspan class="fg" dx="8">Pareto</tspan></text>

    <!-- contact -->
    <text x="28" y="360" class="line l10"><tspan class="green">➜</tspan><tspan class="cyan" dx="10">~</tspan><tspan class="fg" dx="10">./contact --hire</tspan></text>
    <text x="28" y="386" class="line l11"><tspan class="pink">✉</tspan><tspan class="cyan" dx="10">anuvikt@gmail.com</tspan><tspan class="dim" dx="14">·</tspan><tspan class="purple" dx="14">⌖</tspan><tspan class="fg" dx="10">Los Angeles, CA</tspan><tspan class="fg cursor" dx="12">▊</tspan></text>
  </g>
</svg>
