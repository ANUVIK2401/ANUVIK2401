<svg xmlns="http://www.w3.org/2000/svg" width="820" height="52" viewBox="0 0 820 52" fill="none">
  <defs>
    <linearGradient id="nbd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d46"/><stop offset="0.55" stop-color="#ff7043"/><stop offset="1" stop-color="#00e676"/></linearGradient>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141821"/><stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family:'SF Mono','Fira Code','JetBrains Mono',Menlo,Consolas,monospace; font-size:14px; }
    .sm { font-size:12px; }
    .green{fill:#00e676}.cyan{fill:#7dffb8}.fg{fill:#e8ecf2}.dim{fill:#727f92}.yellow{fill:#ffd54f}
    .cursor{animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
  </style>
  <rect x="1" y="1" width="818" height="50" rx="10" fill="#0d0f14" stroke="url(#nbd)" stroke-width="2"/>
  <rect x="1" y="8" width="4" height="36" rx="2" fill="#00e676" filter="url(#glow)"/>
  <g class="mono">
    <text x="26" y="31"><tspan class="green">➜</tspan><tspan class="cyan" dx="10">~/projects</tspan><tspan class="fg" dx="10">ls --sort=impact --features</tspan><tspan class="fg cursor" dx="8">▊</tspan></text>
    <text x="794" y="31" text-anchor="end" class="sm dim"># 10 builds · 4 live demos</text>
  </g>
  <rect x="26" y="18" width="330" height="18" fill="#0d0f14">
    <animate attributeName="x" from="26" to="356" dur="1.1s" begin="0.3s" calcMode="discrete" values="26;60;92;128;170;214;262;310;356" fill="freeze"/>
    <animate attributeName="width" from="330" to="0" dur="1.1s" begin="0.3s" calcMode="discrete" values="330;296;264;228;186;142;94;46;0" fill="freeze"/>
  </rect>
</svg>
