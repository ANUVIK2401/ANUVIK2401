<svg xmlns="http://www.w3.org/2000/svg" width="262" height="250" viewBox="0 0 262 250" fill="none">
  <defs>
    <linearGradient id="nbd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff2d46"/><stop offset="0.55" stop-color="#ff7043"/><stop offset="1" stop-color="#00e676"/></linearGradient>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#141821"/><stop offset="1" stop-color="#08090c"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family:'SF Mono','Fira Code','JetBrains Mono',Menlo,Consolas,monospace; font-size:11px; }
    .xs { font-size:9.5px; }
    .green{fill:#00e676}.cyan{fill:#7dffb8}.purple{fill:#ff2d46}.pink{fill:#ff6b6b}
    .yellow{fill:#ffd54f}.orange{fill:#ffab40}.fg{fill:#e8ecf2}.dim{fill:#727f92}.red{fill:#ff2d46}
    .curve { stroke:#7dffb8; stroke-width:2; fill:none; stroke-dasharray:230; stroke-dashoffset:230; animation:draw 1.6s ease-out forwards; animation-delay:.3s; }
    @keyframes draw { to { stroke-dashoffset:0; } }
    .dot { opacity:0; animation:pop .4s ease-out forwards; }
    @keyframes pop { to { opacity:1; } }
    .d1{animation-delay:1s}.d2{animation-delay:1.3s}.d3{animation-delay:1.6s}
    .alarm { animation:alarm 1.4s ease-in-out infinite; }
    @keyframes alarm { 0%,100%{opacity:.45} 50%{opacity:1} }
  </style>
  <rect x="1" y="1" width="260" height="248" rx="12" fill="url(#pbg)" stroke="url(#nbd)" stroke-width="2"/>
  <path d="M1 13 A12 12 0 0 1 13 1 H249 A12 12 0 0 1 261 13 V30 H1 Z" fill="#0d0f14"/>
  <circle cx="18" cy="15" r="4.5" fill="#ff5f56"/>
  <circle cx="33" cy="15" r="4.5" fill="#ffbd2e"/>
  <circle cx="48" cy="15" r="4.5" fill="#27c93f"/>
  <text x="131" y="19" text-anchor="middle" class="mono xs dim">pacific — freshness-gate</text>

  <g class="mono">
    <text x="16" y="50" class="cyan">freshness = e^(−λ · days_old)</text>

    <!-- axes -->
    <line x1="30" y1="62" x2="30" y2="160" stroke="#242a36" stroke-width="1.5"/>
    <line x1="30" y1="160" x2="240" y2="160" stroke="#242a36" stroke-width="1.5"/>
    <text x="240" y="172" text-anchor="end" class="xs dim">age →</text>

    <!-- decay curve -->
    <path class="curve" filter="url(#glow)" d="M32 66 Q 80 70 110 100 T 200 150 L 236 155"/>

    <!-- chunks on the curve -->
    <g class="dot d1">
      <circle cx="52" cy="72" r="5" fill="#00e676"/>
      <text x="62" y="68" class="xs green">use</text>
    </g>
    <g class="dot d2">
      <circle cx="122" cy="110" r="5" fill="#ffab40"/>
      <text x="132" y="106" class="xs orange">review</text>
    </g>
    <g class="dot d3">
      <circle cx="205" cy="151" r="5" fill="#ff2d46" class="alarm" filter="url(#glow)"/>
      <text x="196" y="140" class="xs red">replace ⚠</text>
    </g>

    <text x="16" y="190" class="xs"><tspan class="dim">rerank</tspan><tspan class="fg" dx="5">= rel×w + fresh×(1−w)</tspan></text>
    <text x="16" y="207" class="xs dim">stale context never reaches the LLM</text>
  </g>

  <rect x="1" y="222" width="260" height="27" rx="12" fill="#0d0f14"/>
  <rect x="1" y="222" width="260" height="10" fill="#0d0f14"/>
  <text x="131" y="239" text-anchor="middle" class="mono xs"><tspan class="cyan">◈</tspan><tspan class="dim" dx="5">gpt-4o judge · zero-latency math gate</tspan></text>
</svg>
