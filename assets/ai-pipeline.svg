<svg xmlns="http://www.w3.org/2000/svg" width="405" height="250" viewBox="0 0 405 250" fill="none">
  <defs>
    <linearGradient id="nbd" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#bd93f9"/><stop offset="0.5" stop-color="#8be9fd"/><stop offset="1" stop-color="#ff79c6"/>
    </linearGradient>
    <linearGradient id="pbg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1c1d2b"/><stop offset="1" stop-color="#101018"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    .mono { font-family:'SF Mono','Fira Code','JetBrains Mono',Menlo,Consolas,monospace; font-size:12px; }
    .xs { font-size:10px; }
    .green{fill:#50fa7b}.cyan{fill:#8be9fd}.purple{fill:#bd93f9}.pink{fill:#ff79c6}
    .yellow{fill:#f1fa8c}.orange{fill:#ffb86c}.fg{fill:#f8f8f2}.dim{fill:#6272a4}
    .wire { stroke:#6272a4; stroke-width:1.5; stroke-dasharray:5 4; animation:flow 1.2s linear infinite; }
    @keyframes flow { to { stroke-dashoffset:-9; } }
    .pulse { animation:pulse 2.4s ease-in-out infinite; }
    @keyframes pulse { 0%,100%{opacity:.25} 50%{opacity:.85} }
    .cursor{animation:blink 1s step-end infinite}
    @keyframes blink{50%{opacity:0}}
  </style>

  <!-- window -->
  <rect x="1" y="1" width="403" height="248" rx="12" fill="url(#pbg)" stroke="url(#nbd)" stroke-width="2"/>
  <path d="M1 13 A12 12 0 0 1 13 1 H392 A12 12 0 0 1 404 13 V32 H1 Z" fill="#10111a"/>
  <circle cx="20" cy="16" r="5" fill="#ff5f56"/>
  <circle cx="37" cy="16" r="5" fill="#ffbd2e"/>
  <circle cx="54" cy="16" r="5" fill="#27c93f"/>
  <text x="202" y="20" text-anchor="middle" class="mono xs dim">agent — langgraph runtime</text>

  <!-- wires -->
  <line x1="96" y1="72" x2="140" y2="72" class="wire"/>
  <line x1="240" y1="72" x2="286" y2="72" class="wire"/>
  <line x1="162" y1="94" x2="130" y2="125" class="wire"/>
  <line x1="190" y1="94" x2="190" y2="125" class="wire"/>
  <line x1="218" y1="94" x2="256" y2="125" class="wire"/>

  <!-- moving packets -->
  <circle r="2.5" fill="#8be9fd" filter="url(#glow)">
    <animateMotion dur="1.6s" repeatCount="indefinite" path="M96 72 L140 72"/>
  </circle>
  <circle r="2.5" fill="#bd93f9" filter="url(#glow)">
    <animateMotion dur="1.6s" begin="0.8s" repeatCount="indefinite" path="M240 72 L286 72"/>
  </circle>

  <!-- nodes -->
  <rect x="18" y="58" width="78" height="28" rx="6" fill="#10111a" stroke="#8be9fd"/>
  <text x="57" y="76" text-anchor="middle" class="mono cyan">prompt</text>

  <rect x="140" y="50" width="100" height="44" rx="8" fill="#bd93f9" class="pulse" opacity=".25" filter="url(#glow)"/>
  <rect x="140" y="50" width="100" height="44" rx="8" fill="#10111a" stroke="#bd93f9" stroke-width="1.5"/>
  <text x="190" y="68" text-anchor="middle" class="mono purple">LangGraph</text>
  <text x="190" y="84" text-anchor="middle" class="mono xs dim">plan · route · act</text>

  <rect x="286" y="58" width="100" height="28" rx="6" fill="#10111a" stroke="#ff79c6"/>
  <text x="336" y="76" text-anchor="middle" class="mono pink">LLM · INT4</text>

  <!-- tools -->
  <rect x="96" y="125" width="62" height="26" rx="6" fill="#10111a" stroke="#50fa7b"/>
  <text x="127" y="142" text-anchor="middle" class="mono xs green">MCP</text>
  <rect x="166" y="125" width="62" height="26" rx="6" fill="#10111a" stroke="#f1fa8c"/>
  <text x="197" y="142" text-anchor="middle" class="mono xs yellow">RAG</text>
  <rect x="236" y="125" width="72" height="26" rx="6" fill="#10111a" stroke="#ffb86c"/>
  <text x="272" y="142" text-anchor="middle" class="mono xs orange">vector-db</text>

  <!-- output -->
  <g class="mono">
    <text x="18" y="184"><tspan class="green">➜</tspan><tspan class="fg" dx="8">answer</tspan><tspan class="dim" dx="8">·</tspan><tspan class="cyan" dx="8">grounded</tspan><tspan class="dim" dx="8">·</tspan><tspan class="green" dx="8">fresh</tspan><tspan class="dim" dx="8">·</tspan><tspan class="purple" dx="8">cited</tspan><tspan class="fg cursor" dx="8">▊</tspan></text>
  </g>

  <!-- status bar -->
  <rect x="1" y="216" width="403" height="33" rx="12" fill="#10111a"/>
  <rect x="1" y="216" width="403" height="12" fill="#10111a"/>
  <text x="202" y="237" text-anchor="middle" class="mono xs"><tspan class="dim">tok/s</tspan><tspan class="yellow" dx="6">13.75</tspan><tspan class="dim" dx="12">p50 TTFT</tspan><tspan class="yellow" dx="6">75ms</tspan><tspan class="dim" dx="12">vram</tspan><tspan class="green" dx="6">−62%</tspan></text>
</svg>
