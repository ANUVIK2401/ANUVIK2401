name: Generate Snake

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: ANUVIK2401
          # Colours mirror scripts/palette.py (crimson/carbon/green): a crimson
          # snake over contribution dots ramping carbon -> phosphor green.
          # color_dots takes exactly 5 stops (0 contributions -> highest).
          # '#' must be percent-encoded as %23 inside the query string.
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?color_snake=%23ff2d46&color_dots=%230d0f14,%230f9d58,%2300c853,%2300e676,%237dffb8

      - name: Push to output branch
        uses: crazy-max/ghaction-github-pages@v3
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
